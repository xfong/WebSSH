worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # ── Upstream: Node.js backend ─────────────────────────────────────────────
    upstream app_backend {
        server app:3000;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # ── Static frontend assets ────────────────────────────────────────────
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── Xpra HTML5 proxy ──────────────────────────────────────────────────
        # Proxies the Xpra HTML5 server running on the SSH host.
        # URL format: /xpra-proxy/PORT/...
        # The port is extracted from the URL and used to proxy to SSH_HOST:PORT.
        # Both HTTP (for static assets) and WebSocket (for the Xpra protocol)
        # are supported.
        #
        # The backend validates the JWT and port before the browser accesses
        # this path (via GET /api/v1/xpra-url/:nodeId which returns the URL).
        # nginx itself does not enforce auth here — the Xpra HTML5 server
        # is only reachable from within the Docker network via host.docker.internal.
        location ~ ^/xpra-proxy/(\d+)(/.*)?$ {
            set $xpra_port $1;
            set $xpra_path $2;
            # Default path to / if not specified
            if ($xpra_path = "") {
                set $xpra_path /;
            }
            # Use the pinned host gateway IP (172.18.0.1) instead of
            # host.docker.internal, which may resolve to the wrong bridge.
            proxy_pass         http://172.18.0.1:$xpra_port$xpra_path$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            # Allow the Xpra HTML5 client to be embedded in an iframe
            add_header X-Frame-Options "SAMEORIGIN";
        }

        # ── Socket.IO (WebSocket + HTTP long-poll fallback) ─────────────────
        # Socket.IO uses /socket.io/ for both the initial HTTP handshake and
        # the WebSocket upgrade. This block must come before /api/ so nginx
        # matches it first and forwards the Upgrade header correctly.
        # Without this, Socket.IO falls back to HTTP polling every 5 seconds.
        location /socket.io/ {
            proxy_pass         http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
        }

        # ── REST API ──────────────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://app_backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── WebSocket: Control channel ────────────────────────────────────────
        location /ws/control {
            proxy_pass         http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_read_timeout 86400s;
        }

        # ── WebSocket: Terminal streaming ─────────────────────────────────────
        location /ws/terminal/ {
            proxy_pass         http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_read_timeout 86400s;
        }

        # ── WebSocket: Xpra GUI streaming (Socket.IO proxy — for admin observe) ──
        location /ws/xpra/ {
            proxy_pass         http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_read_timeout 86400s;
        }
    }

    # ── Redirect HTTP → HTTPS ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }
}
