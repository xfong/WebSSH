services:
  nginx:
    image: nginx:bookworm
    container_name: webssh_nginx
    restart: unless-stopped
    # Publish the configurable host-side ports to nginx's fixed internal
    # HTTPS (443) and HTTP (80) listeners. setup.sh writes these values to .env
    # from HTTPS_PORT and HTTP_PORT in webssh.conf.
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    environment:
      # Used only to render the HTTP → HTTPS redirect destination in nginx.
      HTTPS_PORT: "${HTTPS_PORT:-443}"
    # The custom renderer writes nginx.conf from the template, then starts nginx.
    # It replaces the image's default command so rendering occurs every start.
    command: ["/bin/sh", "/usr/local/bin/webssh-render-nginx"]
    volumes:
      - ./docker/nginx/nginx.conf.template:/etc/nginx/webssh-nginx.conf.template:ro
      - ./docker/nginx/render-config.sh:/usr/local/bin/webssh-render-nginx:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - app
    networks:
      - webssh_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: webssh_app
    restart: unless-stopped
    env_file:
      - .env
    # Add the 'webssh' group so the container process can connect to the PAM
    # helper Unix socket (/run/webssh/pam.sock), which is owned root:webssh 0660.
    # The GID is substituted by setup.sh when it creates the group.
    # If group_add is not set, the container falls back to direct LDAP.
    group_add:
      - "${WEBSSH_GID:-}"
    volumes:
      - ./docker/nginx/ssl/ldap-ca.crt:/app/certs/ldap-ca.crt:ro
      # PAM helper Unix socket (host-side service → container)
      # The socket is created by webssh-pam-helper.service on the host.
      # If the socket does not exist, the backend falls back to direct LDAP.
      - /run/webssh/pam.sock:/run/webssh/pam.sock
      # Secrets files: admin password hash and JWT secret are stored as plain
      # files to avoid Docker Compose $$ interpolation issues with bcrypt hashes.
      # setup.sh writes these files; the backend reads them at startup.
      - ./docker/secrets/admin_hash:/run/secrets/admin_hash:ro
      - ./docker/secrets/jwt_secret:/run/secrets/jwt_secret:ro
    depends_on:
      - redis
    networks:
      - webssh_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:bookworm
    container_name: webssh_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - webssh_net

  # NOTE: The xpra service has been removed. Xpra now runs directly on the
  # SSH host (installed by prereq.sh). The backend starts per-user Xpra
  # daemons via SSH and proxies the HTML5 WebSocket stream to the browser.

volumes:
  redis_data:

networks:
  webssh_net:
    driver: bridge
    ipam:
      config:
        # Pin the subnet so the host gateway is always 172.18.0.1.
        # This allows nginx to proxy Xpra ports on the host using a fixed IP.
        # If 172.18.0.0/16 conflicts with an existing network on your host,
        # change both this subnet and XPRA_HOST_IP in webssh.conf.
        - subnet: "172.18.0.0/16"
          gateway: "172.18.0.1"
