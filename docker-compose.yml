services:
  nginx:
    image: nginx:bookworm
    container_name: webssh_nginx
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - app
    networks:
      - webssh_net

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: webssh_app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./docker/nginx/ssl/ldap-ca.crt:/app/certs/ldap-ca.crt:ro
      # PAM helper Unix socket (host-side service → container)
      # The socket is created by webssh-pam-helper.service on the host.
      # If the socket does not exist, the backend falls back to direct LDAP.
      - /run/webssh/pam.sock:/run/webssh/pam.sock
    depends_on:
      - redis
    networks:
      - webssh_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:bookworm
    container_name: webssh_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - webssh_net

  xpra:
    build:
      context: ./docker/xpra
      dockerfile: Dockerfile
    container_name: webssh_xpra
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - xpra_data:/var/run/xpra
    networks:
      - webssh_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  redis_data:
  xpra_data:

networks:
  webssh_net:
    driver: bridge
